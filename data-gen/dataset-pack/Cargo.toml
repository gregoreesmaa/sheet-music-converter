[package]
name = "dataset-pack"
version = "0.1.0"
edition = "2021"
description = "Validate image<->notation pairs, make deterministic train/val/test splits, and pack manifest.jsonl + dataset card (DVC-friendly)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "dataset-pack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
