[package]
name = "photo-degrade"
version = "0.2.0"
edition = "2021"
description = "Thin facade over published doc-photo-degrade crate for sheet-music-converter."
license = "MIT OR Apache-2.0"

[lib]
name = "photo_degrade"
path = "src/lib.rs"

[[bin]]
name = "photo-degrade"
path = "src/main.rs"

[dependencies]
doc-photo-degrade = "0.2"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
