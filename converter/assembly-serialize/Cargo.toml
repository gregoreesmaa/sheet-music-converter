[package]
name = "assembly-serialize"
version = "0.1.0"
edition = "2021"
description = "Note list -> MusicXML 3.1-first + loss table + validators -> .mscz (MuseScore) zip"
license = "MIT OR Apache-2.0"

[lib]
name = "assembly_serialize"
path = "src/lib.rs"

[[bin]]
name = "assembly-serialize"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
