[package]
name = "assembly-serialize"
version = "0.1.0"
edition = "2021"
description = "Thin CLI and compatibility facade over the published `mscz` crate"
license = "MIT OR Apache-2.0"

[lib]
name = "assembly_serialize"
path = "src/lib.rs"

[[bin]]
name = "assembly-serialize"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
mscz = { version = "0.1", default-features = false, features = ["bekern", "lattice"] }
serde_json = "1"
