[package]
name = "boxnote-mapper"
version = "0.1.0"
edition = "2021"
description = "Glyph boxes/labels plus staff layout -> note-list JSON (naive rules now; learned mapper later)."
license = "MIT OR Apache-2.0"

[lib]
name = "boxnote_mapper"
path = "src/lib.rs"

[[bin]]
name = "boxnote-mapper"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
