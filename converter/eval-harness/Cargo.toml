[package]
name = "eval-harness"
version = "0.1.0"
edition = "2021"
description = "In-tree OMR evaluation harness: renderer symbol boxes -> oracle glyph/layout docs (Phase 0)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "eval-harness"
path = "src/main.rs"

[dependencies]
assembly-serialize = { path = "../assembly-serialize" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
